<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلام ماهور! 🌈</title>
<meta name="description" content="یه سایت کوچیک و شاد، فقط برای ماهور.">
<meta name="theme-color" content="#8b5cf6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#2d2150;background:#fbf9ff;line-height:1.9;overflow-x:hidden;min-height:100vh}
button{-webkit-appearance:none;appearance:none;font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:manipulation}
.bg{position:absolute;top:0;left:0;width:100%;height:700px;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;z-index:0}
.b1{width:260px;height:260px;background:#ffd3e6;top:-90px;right:-80px}
.b2{width:200px;height:200px;background:#d4e6ff;top:180px;left:-90px}
.b3{width:150px;height:150px;background:#e6dcff;top:420px;right:-60px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px}
.hero{position:relative;text-align:center;padding:70px 0 40px;overflow:hidden}
.badge{display:inline-block;background:#fff;border:2px solid #2d2150;border-radius:999px;padding:4px 16px;font-size:14px;font-weight:700;box-shadow:3px 3px 0 #2d2150}
.name{font-size:96px;font-weight:900;line-height:1.4;margin:14px 0 2px;color:#8b5cf6;background:linear-gradient(135deg,#ff6fa8,#8b5cf6 50%,#4c9dff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-animation:wobble 3s ease-in-out infinite;animation:wobble 3s ease-in-out infinite;display:inline-block}
@-webkit-keyframes wobble{0%,100%{-webkit-transform:rotate(-3deg)}50%{-webkit-transform:rotate(3deg) scale(1.04)}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.04)}}
.sub{font-size:19px;font-weight:800}
.hint{margin-top:10px;font-size:14px;color:#6b5a93}
.deco{position:absolute;font-size:30px;-webkit-animation:float 4s ease-in-out infinite;animation:float 4s ease-in-out infinite}
.d1{top:40px;left:8%}.d2{top:120px;right:6%;-webkit-animation-delay:1s;animation-delay:1s}.d3{bottom:0;left:4%;-webkit-animation-delay:2s;animation-delay:2s}.d4{top:30px;right:30%;font-size:22px;-webkit-animation-delay:.5s;animation-delay:.5s}
@-webkit-keyframes float{50%{-webkit-transform:translateY(-12px)}}
@keyframes float{50%{transform:translateY(-12px)}}
.panel{background:#fff;border:3px solid #2d2150;border-radius:26px;box-shadow:6px 6px 0 #2d2150;padding:26px 20px;margin:0 0 34px;text-align:center}
.panel h2{font-size:26px;font-weight:900;line-height:1.5}
.panel .muted{font-size:14px;color:#6b5a93;margin-bottom:10px}
.gift{display:block;margin:12px auto 4px;font-size:96px;line-height:1.2;-webkit-animation:shake 2.2s ease-in-out infinite;animation:shake 2.2s ease-in-out infinite}
@-webkit-keyframes shake{0%,70%,100%{-webkit-transform:rotate(0)}75%{-webkit-transform:rotate(-10deg)}80%{-webkit-transform:rotate(10deg)}85%{-webkit-transform:rotate(-8deg)}90%{-webkit-transform:rotate(6deg)}}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}85%{transform:rotate(-8deg)}90%{transform:rotate(6deg)}}
.note{display:none;margin-top:10px;background:#fff0f7;border:2px dashed #ff8fc0;border-radius:20px;padding:18px 14px}
.note.show{display:block;-webkit-animation:popin .45s ease;animation:popin .45s ease}
.note p{font-size:21px;font-weight:800;line-height:1.8}
@-webkit-keyframes popin{0%{-webkit-transform:scale(.6);opacity:0}70%{-webkit-transform:scale(1.06)}100%{-webkit-transform:scale(1);opacity:1}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.btn{display:inline-block;margin-top:14px;background:#8b5cf6;color:#fff;font-weight:800;font-size:16px;padding:10px 24px;border:3px solid #2d2150;border-radius:999px;box-shadow:3px 3px 0 #2d2150}
.btn:active{-webkit-transform:translate(2px,2px);transform:translate(2px,2px);box-shadow:1px 1px 0 #2d2150}
.btn.pink{background:#ff6fa8}
.stats{font-size:14px;font-weight:700;margin:4px 0 14px}
.pill{display:inline-block;margin:3px 4px;padding:2px 12px;border-radius:999px;background:#f1ebff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:10px;max-width:400px;margin:0 auto}
.card{height:84px;border-radius:16px;border:3px solid #2d2150;background:#8b5cf6;color:#fff;font-size:30px;font-weight:900;box-shadow:3px 3px 0 #2d2150}
.card:nth-child(3n+2){background:#ff6fa8}.card:nth-child(3n){background:#4c9dff}
.card.open,.card.done{background:#fff;color:#2d2150;font-size:40px;-webkit-animation:flip .3s ease;animation:flip .3s ease}
.card.done{background:#eaf3ff;border-color:#4c9dff}
@-webkit-keyframes flip{0%{-webkit-transform:scaleX(.1)}100%{-webkit-transform:scaleX(1)}}
@keyframes flip{0%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
.win{display:none;margin-top:16px;font-size:20px;font-weight:900;color:#8b5cf6}
.win.show{display:block;-webkit-animation:popin .45s ease;animation:popin .45s ease}
.foot{text-align:center;padding:10px 0 40px;font-size:14px;color:#6b5a93}
.fx{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:50}
.bit{position:absolute;width:10px;height:14px;border-radius:3px;-webkit-transition:-webkit-transform 1.1s ease-out,opacity 1.1s ease-in;transition:transform 1.1s ease-out,opacity 1.1s ease-in}
.bit.emo{width:auto;height:auto;font-size:22px;background:none!important}
@media (min-width:700px){.name{font-size:120px}.hero{padding-top:90px}}
@media (max-width:360px){.name{font-size:80px}.card{height:72px}.grid{grid-gap:8px}}
@media (prefers-reduced-motion:reduce){.name,.deco,.gift{-webkit-animation:none;animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="wrap">
  <header class="hero">
    <span class="deco d1" aria-hidden="true">💙</span><span class="deco d2" aria-hidden="true">💗</span><span class="deco d3" aria-hidden="true">🦋</span><span class="deco d4" aria-hidden="true">✨</span>
    <span class="badge">یه سایت فقط مخصوصِ</span><br>
    <h1 class="name">ماهور</h1>
    <p class="sub">باحال‌ترین دخترِ کلاس پنجم 🌟</p>
    <p class="hint">هر جای صفحه رو بزنی، جشن می‌گیریم! 🎉</p>
  </header>

  <section class="panel">
    <h2>جعبهٔ سورپرایز 🎁</h2>
    <p class="muted">روی جعبه بزن ببین چی توشه!</p>
    <button class="gift" id="gift" aria-label="باز کردن جعبهٔ سورپرایز">🎁</button>
    <div class="note" id="note" role="status"><p id="noteText"></p>
      <button class="btn pink" id="again">یه سورپرایز دیگه 🎀</button></div>
  </section>

  <section class="panel">
    <h2>بازی حافظه 🧠</h2>
    <p class="muted">جفت‌های شبیه هم رو پیدا کن!</p>
    <p class="stats"><span class="pill" id="moves">حرکت‌ها: ۰</span><span class="pill" id="best"></span></p>
    <div class="grid" id="grid"></div>
    <p class="win" id="win" role="status"></p>
    <button class="btn" id="reset">دوباره از اول 🔄</button>
  </section>

  <footer class="foot">ساخته شده با کلی ذوق برای ماهور 💜</footer>
</div>
<script>
(function(){
  var fa=function(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];});};
  var colors=['#ff6fa8','#8b5cf6','#4c9dff','#ffb3d4','#a9cfff','#c9b6ff'];
  var emos=['💜','💙','💗','🤍','✨','🦋'];
  var fx=document.getElementById('fx');
  function party(x,y,n){
    for(var i=0;i<n;i++){(function(){
      var b=document.createElement('span');
      var useEmo=Math.random()<.3;
      b.className='bit'+(useEmo?' emo':'');
      if(useEmo)b.textContent=emos[Math.random()*emos.length|0];
      else b.style.background=colors[Math.random()*colors.length|0];
      b.style.left=x+'px';b.style.top=y+'px';
      fx.appendChild(b);
      var a=Math.random()*Math.PI*2,r=60+Math.random()*140;
      var dx=Math.cos(a)*r,dy=Math.sin(a)*r-60+Math.random()*120,rot=Math.random()*720-360;
      setTimeout(function(){b.style.webkitTransform=b.style.transform='translate('+dx+'px,'+(dy+80)+'px) rotate('+rot+'deg)';b.style.opacity='0';},20);
      setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},1300);
    })();}
  }
  function center(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
  var tapEvt=('ontouchstart' in window)?'touchstart':'mousedown';
  document.addEventListener(tapEvt,function(e){
    var t=e.target;while(t&&t!==document){if(t.tagName==='BUTTON'||t.tagName==='A')return;t=t.parentNode;}
    var p=e.touches?e.touches[0]:e;party(p.clientX,p.clientY,12);
  },{passive:true});

  // surprise box
  var notes=['تو خیلی باهوشی! 🧠✨','خنده‌ات حال همه رو خوب می‌کنه 😄','امروز روز توئه! از پس هر کاری برمیای 💪','تو یه خواهر فوق‌العاده‌ای 🌸','فکرای قشنگت مثل ستاره می‌درخشن ⭐','همه دوست دارن کنارت باشن 🤗','کلاس پنجم رو با کلی ستاره تموم می‌کنی 🏅','مهربونیت یه ابرقدرته 🌈','هر روز قوی‌تر و باحال‌تر می‌شی 🚀','اگه جایزهٔ بامزه‌ترین آدم دنیا بود، مال تو بود 🏆','نقاشی دنیا بدون تو رنگ کم داشت 🎨','یادت نره: تو خیلی خاصی 💖'];
  var order=[],pos=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function nextNote(){if(pos>=order.length){order=shuffle(notes.slice());pos=0;}return order[pos++];}
  var gift=document.getElementById('gift'),note=document.getElementById('note'),noteText=document.getElementById('noteText');
  function openGift(btn){noteText.textContent=nextNote();note.className='note';void note.offsetWidth;note.className='note show';var c=center(btn);party(c[0],c[1],26);}
  gift.addEventListener('click',function(){gift.style.display='none';openGift(gift);});
  document.getElementById('again').addEventListener('click',function(){openGift(this);});

  // memory game
  var icons=['🦄','🐱','🍓','🌈','🎈','🍦'];
  var grid=document.getElementById('grid'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best'),win=document.getElementById('win');
  var first=null,lock=false,moves=0,found=0;
  function getBest(){try{return parseInt(localStorage.getItem('mahoor-best')||'0',10);}catch(e){return 0;}}
  function setBest(v){try{localStorage.setItem('mahoor-best',String(v));}catch(e){}}
  function showBest(){var b=getBest();bestEl.textContent=b?('بهترین رکورد: '+fa(b)):'هنوز رکوردی نداری';}
  function build(){
    grid.innerHTML='';first=null;lock=false;moves=0;found=0;movesEl.textContent='حرکت‌ها: ۰';win.className='win';showBest();
    shuffle(icons.concat(icons)).forEach(function(ic){
      var c=document.createElement('button');c.className='card';c.textContent='؟';c.setAttribute('aria-label','کارت پشت‌ورو');c._ic=ic;
      c.addEventListener('click',function(){flip(c);});grid.appendChild(c);
    });
  }
  function show(c){c.textContent=c._ic;c.className='card open';c.setAttribute('aria-label',c._ic);}
  function hide(c){c.textContent='؟';c.className='card';c.setAttribute('aria-label','کارت پشت‌ورو');}
  function flip(c){
    if(lock||c===first||c.className.indexOf('done')>-1||c.className.indexOf('open')>-1)return;
    show(c);
    if(!first){first=c;return;}
    moves++;movesEl.textContent='حرکت‌ها: '+fa(moves);
    if(first._ic===c._ic){
      first.className=c.className='card done';var p=center(c);party(p[0],p[1],10);first=null;found++;
      if(found===icons.length){
        var b=getBest();if(!b||moves<b){setBest(moves);}showBest();
        win.textContent='آفرین ماهور! همه رو با '+fa(moves)+' حرکت پیدا کردی 🏆';win.className='win show';
        var w=window.innerWidth;party(w*.25,200,30);setTimeout(function(){party(w*.75,260,30);},250);setTimeout(function(){party(w*.5,160,30);},500);
      }
    }else{
      lock=true;var a=first;first=null;
      setTimeout(function(){hide(a);hide(c);lock=false;},750);
    }
  }
  document.getElementById('reset').addEventListener('click',build);
  build();
})();
</script>
</body>
</html>
